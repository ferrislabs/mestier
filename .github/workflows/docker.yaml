name: docker

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
      - v*.*.*-rc*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
        description: "Whether to push the image"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Avoid contention with the host-level lock when several cargo invocations
  # run back-to-back in the same job.
  CARGO_INCREMENTAL: 0

jobs:
  rust-check:
    name: rust (${{ matrix.task }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: fmt
            cmd: cargo fmt --all -- --check
          - task: clippy
            cmd: cargo clippy --workspace --all-targets --locked -- -D warnings
          - task: test
            cmd: cargo test --workspace --locked
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Each task gets its own cache slot — clippy and test compile
          # different artefact sets, sharing one cache trashes hit-rate.
          shared-key: rust-${{ matrix.task }}
          # Keep deps cached even when the task itself fails: the next run
          # only has to recompile the fix, not the full dependency graph.
          cache-on-failure: true
          # fmt does not touch target/, skip caching it for that job.
          cache-targets: ${{ matrix.task != 'fmt' }}

      - name: ${{ matrix.task }}
        env:
          SQLX_OFFLINE: "true"
        run: ${{ matrix.cmd }}

  # Compiles the whole Rust workspace once per platform, in parallel with the
  # checks above, and leaves the result in the GitHub Actions cache. The
  # `build` jobs below then only assemble images from that cache: no image is
  # pushed before the checks pass, but nothing waits for them to compile.
  build-rust:
    name: build-rust (${{ matrix.runner.platform }})
    runs-on: ${{ matrix.runner.name }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust-prebuild
          platforms: ${{ matrix.runner.platform }}
          cache-from: type=gha,scope=rust-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=rust-${{ runner.arch }}
          outputs: type=cacheonly

  # Whether this run should push images at all. Centralised here rather than
  # repeated in every job/step `if:` below — a job-level `if:` can't read the
  # `env` context, only `needs`, so this has to be a job with an output.
  # Pull-request builds only push for internal PRs (head repo == this repo):
  # a fork PR must never be able to push with this workflow's registry creds.
  should-push:
    runs-on: ubuntu-24.04
    outputs:
      push: ${{ steps.check.outputs.push || 'false' }}
    steps:
      - id: check
        if: >-
          inputs.push || startsWith(github.ref, 'refs/tags/v') ||
          github.ref_name == github.event.repository.default_branch ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: echo "push=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [rust-check, should-push, build-rust]
    runs-on: ${{ matrix.runner.name }}
    strategy:
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
        target:
          - webapp
          - api
          - mcp-gateway
          - mcp-server
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ferrislabs/mestier-${{ matrix.target }}

      - name: log-in to ghcr
        if: needs.should-push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.runner.platform }}
          tags: ghcr.io/ferrislabs/mestier-${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Rust images read what `build-rust` cached and write nothing:
          # only the webapp image has layers of its own worth keeping.
          cache-from: type=gha,scope=${{ matrix.target == 'webapp' && format('webapp-{0}', runner.arch) || format('rust-{0}', runner.arch) }}
          cache-to: ${{ matrix.target == 'webapp' && format('type=gha,mode=max,scope=webapp-{0}', runner.arch) || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ needs.should-push.outputs.push }}

      - name: prepare digest
        id: digest
        if: needs.should-push.outputs.push == 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        if: needs.should-push.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ runner.arch }}-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: needs.should-push.outputs.push == 'true'
    needs:
      - should-push
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - webapp
          - api
          - mcp-gateway
          - mcp-server
    steps:
      - name: set up builx
        uses: docker/setup-buildx-action@v3

      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.target }}
          merge-multiple: true

      - name: log-in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ferrislabs/mestier-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf 'ghcr.io/ferrislabs/mestier-${{ matrix.target }}@sha256:%s ' *)
