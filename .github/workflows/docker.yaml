name: docker

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
      - v*.*.*-rc*
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
        description: "Whether to push the images (they are always built on dispatch)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Avoid contention with the host-level lock when several cargo invocations
  # run back-to-back in the same job.
  CARGO_INCREMENTAL: 0

jobs:
  rust-check:
    name: rust (${{ matrix.task }})
    # Adding a label re-triggers the workflow: only the build-image label matters.
    if: github.event.action != 'labeled' || github.event.label.name == 'build-image'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: fmt
            cmd: cargo fmt --all -- --check
          - task: clippy
            cmd: cargo clippy --workspace --all-targets --locked -- -D warnings
          - task: test
            cmd: cargo test --workspace --locked
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Each task gets its own cache slot — clippy and test compile
          # different artefact sets, sharing one cache trashes hit-rate.
          shared-key: rust-${{ matrix.task }}
          # Keep deps cached even when the task itself fails: the next run
          # only has to recompile the fix, not the full dependency graph.
          cache-on-failure: true
          # fmt does not touch target/, skip caching it for that job.
          cache-targets: ${{ matrix.task != 'fmt' }}

      - name: ${{ matrix.task }}
        env:
          SQLX_OFFLINE: "true"
        run: ${{ matrix.cmd }}

  # Compiles the whole Rust workspace once per platform, in parallel with the
  # checks above, and leaves the result in the GitHub Actions cache. The
  # `build` jobs below then only assemble images from that cache: no image is
  # pushed before the checks pass, but nothing waits for them to compile.
  build-rust:
    name: build-rust (${{ matrix.runner.platform }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner.name }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log-in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exposes the Actions cache credentials to the Dockerfile as build
      # secrets, so sccache can use the GitHub Actions cache from inside it.
      - name: expose actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL || "");
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN || "");

      - name: build workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust-prebuild
          platforms: ${{ matrix.runner.platform }}
          secrets: |
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/ferrislabs/mestier-buildcache:rust-${{ runner.arch }}
          cache-to: type=registry,ref=ghcr.io/ferrislabs/mestier-buildcache:rust-${{ runner.arch }},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
          outputs: type=cacheonly

  # Decides whether images are built and whether they are pushed. Images are
  # rarely used from a pull request, so a PR builds them only when it carries
  # the `build-image` label (internal PRs only: a fork PR must never push with
  # this workflow's registry creds). `main`, tags and manual dispatch always
  # build. A job-level `if:` can't read the `env` context, only `needs`, so this
  # has to be a job with outputs.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build || 'false' }}
      push: ${{ steps.check.outputs.push || 'false' }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IS_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
          DISPATCH_PUSH: ${{ inputs.push }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-image') }}
          INTERNAL: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          build=false
          push=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build=true
            [ "$DISPATCH_PUSH" = "true" ] && push=true
          elif [ "$EVENT" = "pull_request" ]; then
            if [ "$HAS_LABEL" = "true" ] && [ "$INTERNAL" = "true" ]; then
              build=true
              push=true
            fi
          elif [ "$IS_DEFAULT" = "true" ] || [[ "$REF" == refs/tags/v* ]]; then
            build=true
            push=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

  build:
    needs: [rust-check, plan, build-rust]
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner.name }}
    strategy:
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
        target:
          - webapp
          - api
          - mcp-gateway
          - mcp-server
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ferrislabs/mestier-${{ matrix.target }}

      - name: log-in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: expose actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL || "");
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN || "");

      - name: build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.runner.platform }}
          tags: ghcr.io/ferrislabs/mestier-${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Rust images read what `build-rust` cached and write nothing:
          # only the webapp image has layers of its own worth keeping.
          secrets: |
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/ferrislabs/mestier-buildcache:${{ matrix.target == 'webapp' && format('webapp-{0}', runner.arch) || format('rust-{0}', runner.arch) }}
          cache-to: ${{ matrix.target == 'webapp' && format('type=registry,ref=ghcr.io/ferrislabs/mestier-buildcache:webapp-{0},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd', runner.arch) || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ needs.plan.outputs.push }}

      - name: prepare digest
        id: digest
        if: needs.plan.outputs.push == 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        if: needs.plan.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ runner.arch }}-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    if: needs.plan.outputs.push == 'true'
    needs:
      - plan
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - webapp
          - api
          - mcp-gateway
          - mcp-server
    steps:
      - name: set up builx
        uses: docker/setup-buildx-action@v3

      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.target }}
          merge-multiple: true

      - name: log-in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ferrislabs/mestier-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf 'ghcr.io/ferrislabs/mestier-${{ matrix.target }}@sha256:%s ' *)

  # Deploys the demo: writes the new tag into infra, Argo CD does the rest.
  # Runs only once every image manifest is pushed, and only for main.
  bump-infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: push-manifest
    runs-on: ubuntu-24.04
    # Two merges close together must bump one after the other, never race.
    concurrency:
      group: bump-infra
      cancel-in-progress: false
    steps:
      - name: checkout infra
        uses: actions/checkout@v5
        with:
          repository: ferrislabs/infra
          ref: main
          token: ${{ secrets.INFRA_BOT_TOKEN }}

      - name: bump image tags
        run: |
          tag="sha-${GITHUB_SHA::7}"
          for key in api webapp mcpGateway mcpServer; do
            yq -i ".${key}.image.tag = \"${tag}\"" apps/mestier/images.yaml
          done
          echo "TAG_SHORT=${tag}" >> "$GITHUB_ENV"

      - name: commit and push
        run: |
          if git diff --quiet; then
            echo "images.yaml already at ${TAG_SHORT}, nothing to do"
            exit 0
          fi
          git config user.name "mestier-ci"
          git config user.email "mestier-ci@users.noreply.github.com"
          git commit -am "chore(mestier): deploy ${TAG_SHORT}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "could not push the bump after 3 attempts" >&2
          exit 1
