{{- if .Values.webapp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mestier.fullname" . }}-webapp
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  type: {{ .Values.webapp.service.type }}
  selector:
    {{- include "mestier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
  ports:
    - name: http
      port: {{ .Values.webapp.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
