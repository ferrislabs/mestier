{{- if .Values.mcpServer.enabled }}
{{- $env := deepCopy .Values.mcpServer.env }}
{{- $_ := set $env "MCP_SERVER_API_URL" (default (printf "http://%s-api:%v" (include "mestier.fullname" .) .Values.api.service.port) $env.MCP_SERVER_API_URL) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mestier.fullname" . }}-mcp-server
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "mestier.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      {{- with .Values.mcpServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mestier.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-server
        {{- with .Values.mcpServer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mestier.serviceAccountName" . }}
      {{- with .Values.mcpServer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: {{ include "mestier.image" (dict "image" .Values.mcpServer.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          {{- with .Values.mcpServer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpServer.service.port }}
              protocol: TCP
          env:
            - name: MCP_SERVER_LISTEN
              value: {{ printf "0.0.0.0:%v" .Values.mcpServer.service.port | quote }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
      {{- with .Values.mcpServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mestier.fullname" . }}-mcp-server
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "mestier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
