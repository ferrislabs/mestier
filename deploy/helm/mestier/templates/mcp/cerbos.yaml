{{- if .Values.cerbos.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mestier.fullname" . }}-cerbos
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: cerbos
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mestier.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cerbos
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/mcp/cerbos-config.yaml") . | sha256sum }}
      labels:
        {{- include "mestier.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cerbos
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cerbos.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cerbos
          image: "{{ .Values.cerbos.image.repository }}:{{ .Values.cerbos.image.tag }}"
          imagePullPolicy: {{ .Values.cerbos.image.pullPolicy }}
          args: ["server", "--config=/conf/config.yaml"]
          {{- with .Values.cerbos.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.cerbos.service.port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cerbos.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mestier.fullname" . }}-cerbos
            items:
              - key: config.yaml
                path: config.yaml
        - name: policies
          configMap:
            name: {{ include "mestier.fullname" . }}-cerbos
            items:
              - key: mcp_tool.yaml
                path: mcp_tool.yaml
      {{- with .Values.cerbos.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cerbos.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cerbos.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mestier.fullname" . }}-cerbos
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: cerbos
spec:
  type: ClusterIP
  selector:
    {{- include "mestier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cerbos
  ports:
    - name: http
      port: {{ .Values.cerbos.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
