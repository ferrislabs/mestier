{{- if .Values.mcpGateway.enabled }}
{{- $env := deepCopy .Values.mcpGateway.env }}
{{- $_ := set $env "MCP_GATEWAY_PDP_URL" (default (printf "http://%s-cerbos:%v" (include "mestier.fullname" .) .Values.cerbos.service.port) $env.MCP_GATEWAY_PDP_URL) }}
{{- $_ := set $env "MCP_GATEWAY_UPSTREAM_URL" (default (printf "http://%s-mcp-server:%v/mcp" (include "mestier.fullname" .) .Values.mcpServer.service.port) $env.MCP_GATEWAY_UPSTREAM_URL) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mestier.fullname" . }}-mcp-gateway
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: {{ .Values.mcpGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "mestier.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-gateway
  template:
    metadata:
      {{- with .Values.mcpGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mestier.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-gateway
        {{- with .Values.mcpGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mestier.serviceAccountName" . }}
      {{- with .Values.mcpGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-gateway
          image: {{ include "mestier.image" (dict "image" .Values.mcpGateway.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.mcpGateway.image.pullPolicy }}
          {{- with .Values.mcpGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpGateway.service.port }}
              protocol: TCP
          env:
            - name: MCP_GATEWAY_LISTEN
              value: {{ printf "0.0.0.0:%v" .Values.mcpGateway.service.port | quote }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MCP_GATEWAY_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "mcpGateway.existingSecret is required (key MCP_GATEWAY_EXCHANGE_CLIENT_SECRET)" .Values.mcpGateway.existingSecret }}
                  key: MCP_GATEWAY_EXCHANGE_CLIENT_SECRET
          # The gateway serves only /mcp and the RFC 9728 metadata, so a
          # TCP check is the probe that does not depend on a token.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcpGateway.resources | nindent 12 }}
      {{- with .Values.mcpGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mestier.fullname" . }}-mcp-gateway
  labels:
    {{- include "mestier.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  type: {{ .Values.mcpGateway.service.type }}
  selector:
    {{- include "mestier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
  ports:
    - name: http
      port: {{ .Values.mcpGateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
