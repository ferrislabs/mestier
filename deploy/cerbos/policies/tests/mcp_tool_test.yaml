name: McpToolTests
description: Interim MCP gateway policy v1
principals:
  reader:
    id: u1
    roles: ["user"]
    attr:
      scopes: ["mestier.read"]
  doe_writer:
    id: u2
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.doe.write"]
  maintenance_writer:
    id: u4
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.maintenance.write"]
  crm_writer:
    id: u5
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.crm.write"]
  quote_writer:
    id: u6
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.quote.write"]
  planning_writer:
    id: u7
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.planning.write"]
  reference_writer:
    id: u8
    roles: ["user"]
    attr:
      scopes: ["mestier.read", "mestier.reference.write"]
  no_scope:
    id: u3
    roles: ["user"]
    attr:
      scopes: []
resources:
  read_project:
    kind: mcp_tool
    id: list_projects
    attr: {access: read, domain: project, organization: acme}
  write_doe:
    kind: mcp_tool
    id: create_doe
    attr: {access: write, domain: doe, organization: acme}
  write_maintenance:
    kind: mcp_tool
    id: create_maintenance_contract_draft
    attr: {access: write, domain: maintenance, organization: acme}
  read_maintenance:
    kind: mcp_tool
    id: list_maintenance_due
    attr: {access: read, domain: maintenance, organization: acme}
  write_crm:
    kind: mcp_tool
    id: create_customer
    attr: {access: write, domain: crm, organization: acme}
  read_crm:
    kind: mcp_tool
    id: list_customers
    attr: {access: read, domain: crm, organization: acme}
  write_quote:
    kind: mcp_tool
    id: create_quote
    attr: {access: write, domain: quote, organization: acme}
  write_planning:
    kind: mcp_tool
    id: create_task
    attr: {access: write, domain: planning, organization: acme}
  write_product:
    kind: mcp_tool
    id: create_product
    attr: {access: write, domain: reference, organization: acme}
  write_supplier:
    kind: mcp_tool
    id: create_supplier
    attr: {access: write, domain: purchase, organization: acme}
  write_invoice:
    kind: mcp_tool
    id: create_invoice
    attr: {access: write, domain: invoice, organization: acme}
tests:
  - name: read with mestier.read is allowed
    input:
      principals: [reader]
      resources: [read_project]
      actions: [list_projects]
    expected:
      - principal: reader
        resource: read_project
        actions:
          list_projects: EFFECT_ALLOW
  - name: read without mestier.read is denied
    input:
      principals: [no_scope]
      resources: [read_project]
      actions: [list_projects]
    expected:
      - principal: no_scope
        resource: read_project
        actions:
          list_projects: EFFECT_DENY
  - name: write DOE with mestier.doe.write is allowed
    input:
      principals: [doe_writer]
      resources: [write_doe]
      actions: [create_doe]
    expected:
      - principal: doe_writer
        resource: write_doe
        actions:
          create_doe: EFFECT_ALLOW
  - name: write DOE with only mestier.read is denied
    input:
      principals: [reader]
      resources: [write_doe]
      actions: [create_doe]
    expected:
      - principal: reader
        resource: write_doe
        actions:
          create_doe: EFFECT_DENY
  - name: write outside DOE is denied even with every scope
    input:
      principals: [doe_writer]
      resources: [write_invoice]
      actions: [create_invoice]
    expected:
      - principal: doe_writer
        resource: write_invoice
        actions:
          create_invoice: EFFECT_DENY
  - name: unknown action on an unclassified resource is denied
    input:
      principals: [doe_writer]
      resources: [write_invoice]
      actions: [delete_project]
    expected:
      - principal: doe_writer
        resource: write_invoice
        actions:
          delete_project: EFFECT_DENY
  - name: write maintenance with mestier.maintenance.write is allowed
    input:
      principals: [maintenance_writer]
      resources: [write_maintenance]
      actions: [create_maintenance_contract_draft]
    expected:
      - principal: maintenance_writer
        resource: write_maintenance
        actions:
          create_maintenance_contract_draft: EFFECT_ALLOW
  - name: write maintenance with only mestier.read is denied
    input:
      principals: [reader]
      resources: [write_maintenance]
      actions: [create_maintenance_contract_draft]
    expected:
      - principal: reader
        resource: write_maintenance
        actions:
          create_maintenance_contract_draft: EFFECT_DENY
  - name: write maintenance with only mestier.doe.write is denied
    input:
      principals: [doe_writer]
      resources: [write_maintenance]
      actions: [create_maintenance_contract_draft]
    expected:
      - principal: doe_writer
        resource: write_maintenance
        actions:
          create_maintenance_contract_draft: EFFECT_DENY
  - name: mestier.maintenance.write alone does not open a DOE write
    input:
      principals: [maintenance_writer]
      resources: [write_doe]
      actions: [create_doe]
    expected:
      - principal: maintenance_writer
        resource: write_doe
        actions:
          create_doe: EFFECT_DENY
  - name: read maintenance with mestier.read is allowed
    input:
      principals: [reader]
      resources: [read_maintenance]
      actions: [list_maintenance_due]
    expected:
      - principal: reader
        resource: read_maintenance
        actions:
          list_maintenance_due: EFFECT_ALLOW
  - name: write crm with mestier.crm.write is allowed
    input:
      principals: [crm_writer]
      resources: [write_crm]
