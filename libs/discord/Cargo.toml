[package]
name = "discord"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
common = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
url = { workspace = true }
mockall = { workspace = true, optional = true }

[features]
# Exposes the `automock` doubles to downstream test targets. Never enabled by a
# normal build: only a dev-dependency turns it on, and the resolver keeps
# dev-only features out of `cargo build`.
mock = ["dep:mockall"]

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true }
