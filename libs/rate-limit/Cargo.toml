[package]
name = "rate-limit"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mockall = { workspace = true, optional = true }

[features]
# Exposes the `automock` doubles to downstream test targets. Never enabled by a
# normal build: only a dev-dependency turns it on, and the resolver keeps
# dev-only features out of `cargo build`.
mock = ["dep:mockall"]

[dev-dependencies]
divan = { workspace = true }
mockall = { workspace = true }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[[bench]]
name = "key_format"
harness = false
